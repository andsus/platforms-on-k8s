# Disable Kafka, keep PostgreSQL and Redis working
conference-app:
  postgresql:
    image:
      repository: "bitnamisecure/postgresql"
      tag: "latest"
  redis:
    image:
      repository: "bitnamisecure/redis"
      tag: "latest"
  kafka:
    image:
      repository: "soldevelo/kafka"
      tag: "4.1"
  install:
    infrastructure: true
    ingress: true
