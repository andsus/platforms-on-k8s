# Fix frontend probe timing to prevent premature kills
conference-app:
  postgresql:
    image:
      repository: "bitnamisecure/postgresql"
      tag: "latest"
  redis:
    image:
      repository: "bitnamisecure/redis"
      tag: "latest"
  kafka:
    image:
      repository: "bitnamilegacy/kafka"
      tag: "4.0"
  services:
    frontend:
      debug: true
      livenessProbe:
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 5
      readinessProbe:
        initialDelaySeconds: 15
        periodSeconds: 15
        failureThreshold: 3
  install:
    infrastructure: true
    ingress: true