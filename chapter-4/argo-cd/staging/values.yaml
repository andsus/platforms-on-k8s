# Fix frontend missing Redis password
conference-app:
  postgresql:
    image:
      repository: "bitnamisecure/postgresql"
      tag: "latest"
  redis:
    image:
      repository: "bitnamisecure/redis"
      tag: "latest"
  kafka:
    image:
      repository: "bitnamilegacy/kafka"
      tag: "4.0"
  services:
    frontend:
      env:
        - name: REDIS_HOST
          value: "staging-environment-redis-master.staging.svc.cluster.local"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: staging-environment-redis
              key: redis-password
  install:
    infrastructure: true
    ingress: true