# Use fixed frontend image
conference-app:
  postgresql:
    image:
      repository: "bitnamisecure/postgresql"
      tag: "latest"
  redis:
    image:
      repository: "bitnamisecure/redis"
      tag: "latest"
  kafka:
    image:
      repository: "bitnamilegacy/kafka"
      tag: "4.0"
  services:
    registry: "localhost"
    frontend:
      image: "frontend-fixed"
    tag: "latest"
    debug: true
  install:
    infrastructure: true
    ingress: true