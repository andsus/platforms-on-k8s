# Override subchart values - use Ubuntu Kafka
conference-app:
  postgresql:
    image:
      repository: "bitnamisecure/postgresql"
      tag: "latest"
  kafka:
    image:
      repository: "ubuntu/kafka"
      tag: "latest"
  redis:
    image:
      repository: "bitnamisecure/redis"
      tag: "latest"
  install:
    infrastructure: true
    ingress: true