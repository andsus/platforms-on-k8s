# Enable frontend debug and check if it needs Redis
conference-app:
  postgresql:
    image:
      repository: "bitnamisecure/postgresql"
      tag: "latest"
  redis:
    image:
      repository: "bitnamisecure/redis"
      tag: "latest"
  kafka:
    image:
      repository: "bitnamilegacy/kafka"
      tag: "4.0"
  services:
    frontend:
      debug: true
  install:
    infrastructure: true
    ingress: true